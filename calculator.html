<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 320px;
      padding: 22px;
      border-radius: 28px;
      background: #ffffff;
      box-shadow: 0 25px 60px rgba(0,0,0,.15);
    }

    .display {
      height: 90px;
      margin-bottom: 18px;
      padding: 20px;
      display: flex;
      align-items: end;
      justify-content: flex-end;
      overflow: hidden;
      border-radius: 18px;
      background: #f1f3f5;
      color: #15181c;
      font-size: 38px;
      font-weight: 500;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 58px;
      border: 0;
      border-radius: 16px;
      background: #f0f1f3;
      color: #17191d;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #e3e5e8;
    }

    .operator {
      background: #1683ff;
      color: white;
    }

    .operator:hover {
      background: #0875ed;
    }

    .clear {
      color: #1683ff;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <div class="display" id="display">0</div>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="deleteNumber()">⌫</button>
      <button onclick="addNumber('%')">%</button>
      <button class="operator" onclick="addNumber('/')">÷</button>

      <button onclick="addNumber('7')">7</button>
      <button onclick="addNumber('8')">8</button>
      <button onclick="addNumber('9')">9</button>
      <button class="operator" onclick="addNumber('*')">×</button>

      <button onclick="addNumber('4')">4</button>
      <button onclick="addNumber('5')">5</button>
      <button onclick="addNumber('6')">6</button>
      <button class="operator" onclick="addNumber('-')">−</button>

      <button onclick="addNumber('1')">1</button>
      <button onclick="addNumber('2')">2</button>
      <button onclick="addNumber('3')">3</button>
      <button class="operator" onclick="addNumber('+')">+</button>

      <button onclick="addNumber('0')">0</button>
      <button onclick="addNumber('.')">.</button>
      <button onclick="calculate()">=</button>
    </div>

  </div>

<script>
  const display = document.getElementById("display");

  function addNumber(number) {
    // Impede começar uma conta com operadores
    if (
      display.innerText === "0" &&
      ["+", "-", "*", "/", "%"].includes(number)
    ) {
      return;
    }

    // Depois de um resultado, começar um número novo
    if (display.innerText === "Erro") {
      display.innerText = number;
      return;
    }

    // Evita colocar dois pontos no mesmo número
    if (number === ".") {
      const parts = display.innerText.split(/[\+\-\*\/]/);
      const currentNumber = parts[parts.length - 1];

      if (currentNumber.includes(".")) {
        return;
      }
    }

    // Evita dois operadores seguidos
    if (["+", "-", "*", "/"].includes(number)) {
      const lastChar = display.innerText.slice(-1);

      if (["+", "-", "*", "/"].includes(lastChar)) {
        display.innerText =
          display.innerText.slice(0, -1) + number;
        return;
      }
    }

    // Se o display estiver em 0, substitui
    if (display.innerText === "0") {
      display.innerText = number;
    } else {
      display.innerText += number;
    }
  }

  function clearDisplay() {
    display.innerText = "0";
  }

  function deleteNumber() {
    display.innerText = display.innerText.slice(0, -1);

    if (display.innerText === "") {
      display.innerText = "0";
    }
  }

  function calculate() {
    try {
      let expression = display.innerText;

      // Verifica se existe uma porcentagem
      if (expression.includes("%")) {

        /*
          Exemplos:

          50%       → 50 / 100
          200*10%   → 200*10/100
          100+20%   → 100+(100*20/100)
          100-20%   → 100-(100*20/100)
        */

        expression = expression.replace(
          /(\d+(?:\.\d+)?)%/g,
          function(match, number, offset, fullExpression) {

            // Procura o operador antes da porcentagem
            const before = fullExpression.slice(0, offset);

            const lastOperator = before.match(/[\+\-\*\/]/);

            // Porcentagem simples: 50% = 0.5
            if (!lastOperator) {
              return `(${number}/100)`;
            }

            const operator = lastOperator[0];

            // Para + e -, calcula a porcentagem em relação
            // ao número que está antes do operador.
            if (operator === "+" || operator === "-") {
              const numberBeforeOperator =
                before.slice(0, before.lastIndexOf(operator))
                      .match(/(\d+(?:\.\d+)?)$/);

              if (numberBeforeOperator) {
                const base = numberBeforeOperator[1];

                return `(${base}*${number}/100)`;
              }
            }

            // Para multiplicação e divisão,
            // porcentagem vira número / 100.
            return `(${number}/100)`;
          }
        );
      }

      const result = eval(expression);

      if (!isFinite(result)) {
        display.innerText = "Erro";
        return;
      }

      // Remove casas decimais desnecessárias
      display.innerText =
        Number.isInteger(result)
          ? result
          : parseFloat(result.toFixed(10));

    } catch {
      display.innerText = "Erro";
    }
  }
</script>


</body>
</html>
